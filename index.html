    <!--
      ════════════════════════════════════════════════════════════════════
      PRELOADER FLASH PREVENTION — MUST BE FIRST IN <head>
      ════════════════════════════════════════════════════════════════════
      Problem: SSG/Puppeteer captures the prerendered hero HTML AFTER the
      preloader finishes. When a real user receives that HTML, the hero is
      visible for the ~300ms it takes React to parse and mount.

      Solution: A synchronous inline <script> that runs BEFORE any content
      is painted checks sessionStorage. First-time visitors get the
      'js-preloading' class on <html>, which CSS uses to hide #root.
      The Preloader's useLayoutEffect removes the class synchronously
      before the browser's first paint — so the preloader overlay appears
      with zero hero flash.

      Return visitors: sessionStorage is set → script does NOT add the
      class → #root is never hidden → instant page load, no delay.

      Puppeteer (prerender): prerender.mjs calls evaluateOnNewDocument()
      to pre-seed sessionStorage before page load, so this script never
      adds the class and the captured HTML is clean.
      ════════════════════════════════════════════════════════════════════
    -->
    <style>.js-preloading #root{visibility:hidden;pointer-events:none}</style>
    <script>try{if(!sessionStorage.getItem('preloaderShown')){document.documentElement.classList.add('js-preloading');}}catch(e){}</script>
